<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">F9 一键切换操作模式</title><desc id="desc">配置快捷键后，F9 在原生触摸和相对鼠标模式之间切换；默认不自动开启。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168a83" stroke-width="2"/></marker></defs>
<rect width="1080" height="520" rx="24" fill="#f2f6f9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="49" font-size="16" fill="#62798c" font-weight="600">TOUCHMOUSE  /  操作指南</text><text x="36" y="96" font-size="32" fill="#18334a" font-weight="700">F9 一键切换操作模式</text><rect x="36" y="130" width="444" height="210" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="60" y="170" font-size="27" fill="#18334a" font-weight="700">原生触摸</text><rect x="60" y="192" width="180" height="116" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M80 214 h140" stroke="#dbe5ed" stroke-width="2"/><circle cx="130" cy="250" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="130" cy="250" r="8" fill="#168a83"/><text x="266" y="237" font-size="22" fill="#18334a" font-weight="400">由桌面处理</text><text x="266" y="272" font-size="22" fill="#18334a" font-weight="400">触摸输入</text><rect x="600" y="130" width="444" height="210" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="624" y="170" font-size="27" fill="#18334a" font-weight="700">相对鼠标</text><rect x="624" y="192" width="180" height="116" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M644 214 h140" stroke="#dbe5ed" stroke-width="2"/><circle cx="670" cy="265" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="670" cy="265" r="8" fill="#168a83"/><path d="M747 225 l0 38 10 -10 10 19 9 -5 -10 -18 15 -1 Z" fill="#18334a" stroke="white" stroke-width="2"/><text x="829" y="237" font-size="22" fill="#18334a" font-weight="400">滑动移指针</text><text x="829" y="272" font-size="22" fill="#18334a" font-weight="400">轻点作点击</text><rect x="498" y="186" width="84" height="64" rx="12" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><text x="520" y="228" font-size="28" fill="#168a83" font-weight="700">F9</text><path d="M483 160 L596 160" fill="none" stroke="#168a83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M596 315 L483 315" fill="none" stroke="#168a83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="36" y="388" font-size="26" fill="#18334a" font-weight="700">按一次开启，再按一次停止</text><text x="36" y="427" font-size="21" fill="#62798c" font-weight="400">需先配置 F9 快捷键；程序默认不会自动进入相对鼠标模式。</text><text x="36" y="467" font-size="21" fill="#62798c" font-weight="400">停止程序后释放触摸屏，恢复原生触摸。</text></g></svg>