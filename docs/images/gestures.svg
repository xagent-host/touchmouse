<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">三种手势，快速上手</title><desc id="desc">单指滑动相对移动指针；单指轻点左键；双指轻点右键。点击发生在指针处，而非手指触点。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168a83" stroke-width="2"/></marker></defs>
<rect width="1080" height="520" rx="24" fill="#f2f6f9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="49" font-size="16" fill="#62798c" font-weight="600">TOUCHMOUSE  /  操作指南</text><text x="36" y="96" font-size="32" fill="#18334a" font-weight="700">三种手势，快速上手</text><rect x="36" y="128" width="320" height="326" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="58" y="166" font-size="18" fill="#168a83" font-weight="700">01</text><text x="98" y="167" font-size="24" fill="#18334a" font-weight="700">单指滑动</text><rect x="56" y="188" width="280" height="160" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M76 210 h240" stroke="#dbe5ed" stroke-width="2"/><circle cx="119" cy="285" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="119" cy="285" r="8" fill="#168a83"/><path d="M147 285 L192 285" fill="none" stroke="#168a83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M231 245 l0 38 10 -10 10 19 9 -5 -10 -18 15 -1 Z" fill="#18334a" stroke="white" stroke-width="2"/><path d="M250 229 L295 229" fill="none" stroke="#168a83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="56" y="384" font-size="19" fill="#18334a" font-weight="400">像触控板一样移动指针</text><text x="56" y="421" font-size="17" fill="#62798c" font-weight="400">抬手换位置，指针不会跳转</text><rect x="380" y="128" width="320" height="326" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="402" y="166" font-size="18" fill="#168a83" font-weight="700">02</text><text x="442" y="167" font-size="24" fill="#18334a" font-weight="700">单指轻点</text><rect x="400" y="188" width="280" height="160" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M420 210 h240" stroke="#dbe5ed" stroke-width="2"/><circle cx="470" cy="285" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="470" cy="285" r="8" fill="#168a83"/><path d="M592 246 l0 38 10 -10 10 19 9 -5 -10 -18 15 -1 Z" fill="#18334a" stroke="white" stroke-width="2"/><text x="572" y="324" font-size="17" fill="#168a83" font-weight="600">左键</text><text x="400" y="384" font-size="19" fill="#18334a" font-weight="400">在指针当前位置点击左键</text><text x="400" y="421" font-size="17" fill="#62798c" font-weight="400">轻点后迅速抬起</text><rect x="724" y="128" width="320" height="326" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="746" y="166" font-size="18" fill="#168a83" font-weight="700">03</text><text x="786" y="167" font-size="24" fill="#18334a" font-weight="700">双指轻点</text><rect x="744" y="188" width="280" height="160" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M764 210 h240" stroke="#dbe5ed" stroke-width="2"/><circle cx="792" cy="285" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="792" cy="285" r="8" fill="#168a83"/><circle cx="847" cy="285" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="847" cy="285" r="8" fill="#168a83"/><path d="M934 239 l0 38 10 -10 10 19 9 -5 -10 -18 15 -1 Z" fill="#18334a" stroke="white" stroke-width="2"/><rect x="940" y="283" width="68" height="48" rx="5" fill="white" stroke="#168a83" stroke-width="2"/><text x="949" y="313" font-size="17" fill="#168a83" font-weight="400">菜单</text><text x="744" y="384" font-size="19" fill="#18334a" font-weight="400">在指针当前位置点击右键</text><text x="744" y="421" font-size="17" fill="#62798c" font-weight="400">两指快速落下，再全部抬起</text><text x="36" y="492" font-size="19" fill="#62798c" font-weight="400">圆点表示手指触点；箭头表示移动方向。点击位置由鼠标指针决定。</text></g></svg>