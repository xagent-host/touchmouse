<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">了解边界，操作更顺手</title><desc id="desc">多指触摸暂停指针，全部抬起后恢复；不支持滚动、拖拽和长按点击。双指轻点仍可右键。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168a83" stroke-width="2"/></marker></defs>
<rect width="1080" height="520" rx="24" fill="#f2f6f9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="49" font-size="16" fill="#62798c" font-weight="600">TOUCHMOUSE  /  操作指南</text><text x="36" y="96" font-size="32" fill="#18334a" font-weight="700">了解边界，操作更顺手</text><rect x="36" y="130" width="492" height="288" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="60" y="173" font-size="26" fill="#18334a" font-weight="700">多指时暂停移动</text><rect x="60" y="195" width="200" height="132" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M80 217 h160" stroke="#dbe5ed" stroke-width="2"/><circle cx="114" cy="270" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="114" cy="270" r="8" fill="#168a83"/><circle cx="170" cy="270" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="170" cy="270" r="8" fill="#168a83"/><text x="290" y="249" font-size="42" fill="#168a83" font-weight="700">Ⅱ</text><text x="290" y="292" font-size="21" fill="#18334a" font-weight="400">指针暂停</text><text x="60" y="383" font-size="21" fill="#62798c" font-weight="400">所有手指抬起后，再单指滑动</text><rect x="552" y="130" width="492" height="288" rx="18" fill="#ffffff" stroke="#dbe5ed" stroke-width="2"/><text x="576" y="173" font-size="26" fill="#18334a" font-weight="700">这些操作暂不支持</text><rect x="576" y="195" width="200" height="132" rx="12" fill="#f7fafc" stroke="#bbcbd8" stroke-width="2"/><path d="M596 217 h160" stroke="#dbe5ed" stroke-width="2"/><circle cx="642" cy="268" r="24" fill="#e5f6f2" stroke="#168a83" stroke-width="2"/><circle cx="642" cy="268" r="8" fill="#168a83"/><text x="806" y="250" font-size="24" fill="#9b6134" font-weight="600">暂不支持</text><text x="806" y="292" font-size="18" fill="#62798c" font-weight="400">不会生成这些操作</text><text x="576" y="383" font-size="21" fill="#62798c" font-weight="400">滚动 · 拖拽 · 长按点击</text><text x="36" y="464" font-size="21" fill="#62798c" font-weight="400">双指滑动、长按或三指触摸不会触发点击。双指快速轻点仍可右键。</text></g></svg>